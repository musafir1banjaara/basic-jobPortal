<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LakshyaIn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href={% url 'home' %} class="text-xl font-bold text-slate-900 flex items-center gap-2">
                <span class="material-icons-outlined text-indigo-600">work</span>
                LakshyaIn
            </a>
        </div>
    </header>
    <main class="px-12 my-12 pb-12">
        <form action="{% url 'create-job' %}" method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div class="space-x-4">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" class="input" />
            </div>
            <div class="space-x-4">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" class="input" />
            </div>
            <div class="space-x-4">
                <label for="company-name">Company Name</label>
                <input type="text" id="company-name" name="company_name" class="input" />
            </div>
            <div class="space-x-4">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" class="input" />
            </div>
            <div class="space-x-4">
                <label for="salary">Salary</label>
                <input type="number" id="salary" name="salary" class="input" />
            </div>
            <div class="space-x-4">
                <label for="logo">Logo</label>
                <input type="file" accept=".png" id="logo" name="logo" class="file-input" />
                <!-- accept restricts what extension of file is allowed to be uploaded -->
            </div>
            <button type="submit" class="btn btn-success">Submit</button>
        </form>
    </main>
</body>

</html>
